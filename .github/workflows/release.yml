name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Verify npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.NPM_TOKEN;
          if (!token || token !== token.trim() || !token.startsWith("npm_")) {
            throw new Error("NPM_TOKEN is missing or has an unexpected format.");
          }
          if (token.length < 30) throw new Error("NPM_TOKEN contains a shortened token identifier, not the full credential.");
          const response = await fetch("https://registry.npmjs.org/-/whoami", {
            headers: { authorization: `Bearer ${token}` },
          });
          if (!response.ok) throw new Error(`npm authentication failed: HTTP ${response.status}`);
          console.log("npm authentication verified.");
          JS
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run check
      - name: Release
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
